version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: librarymanagement-db
    environment:
      POSTGRES_DB: librarymanagement
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: librarymanagement-backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/librarymanagement
      DB_USER: postgres
      DB_PASSWORD: password

volumes:
  postgres_data: